name: vendor-upstream-check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: vendor-upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false

      - name: Run vendor upstream check
        env:
          GH_TOKEN: ${{ secrets.SYNC_BOT_TOKEN || github.token }}
        run: node scripts/check-vendor-upstream.mjs
