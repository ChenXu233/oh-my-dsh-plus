[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Standalone Tauri shell for oh-my-dsh-plus"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
